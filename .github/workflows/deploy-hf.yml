name: Deploy to Hugging Face Space

# آليَّة نَشر مُدارَة عَبر مَكتَبَة huggingface_hub الرَّسميَّة — تَتَجَنَّب
# مَتاهَة auth في git-over-HTTPS، تَستَخدِم HF_TOKEN فَقَط. كُلّ push إلى
# main أَو فَرع التَّطوير يُحَدِّث الـ Space تِلقائيّاً.
#
# الإعداد لِمَرَّة واحِدَة:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name: HF_TOKEN
#   Value: مِفتاح Write مِن https://huggingface.co/settings/tokens

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'platform-v1/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'README.md'
      - '.github/workflows/deploy-hf.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_REPO_ID: acommerceecommerce/acommerce.ecommerce
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify HF_TOKEN secret is set
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "::error::HF_TOKEN secret missing."
            echo "Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: HF_TOKEN  ·  Value: <Write token من https://huggingface.co/settings/tokens>"
            exit 1
          fi

      - name: Prune to deployable tree
        run: |
          # احذِف المُجَلَّدات الَّتي لا يَحتاجها V1.App (تَحوي خُطوط/صُوَر
          # تَرفُضها HF بِلا Git LFS، وتَزيد حَجم الصورَة).
          rm -rf Apps Ejar.TestForNewMaui clients libs tools tests docs scripts
          rm -f ACommerce.Platform.sln ACommerce.Platform.slnLaunch \
                "Clean bin obj and Rebuilgd.sh" CLAUDE.md \
                runtime-report.json runtime-report.md
          # احذِف مُجَلَّد .github ولا حاجَة لِنُسخَتِه إلى HF.
          rm -rf .github
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install huggingface_hub
        run: pip install --quiet "huggingface_hub>=0.30"

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_REF: ${{ github.ref_name }}
        run: |
          python <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          from huggingface_hub.utils import HfHubHTTPError

          repo_id = os.environ['HF_REPO_ID']
          sha = os.environ.get('COMMIT_SHA', 'unknown')[:7]
          ref = os.environ.get('COMMIT_REF', 'unknown')
          msg = f"deploy: sync {sha} from {ref}"

          api = HfApi(token=os.environ['HF_TOKEN'])

          # تَشخيص اختياريّ (غَير قاتِل): whoami نُقطَة مَحدودَة المُعَدَّل
          # بِصَرامَة في HF — لا نُفشِل النَّشر إن اصطَدَمَت بِالحَدّ. الفَحص
          # الحَقيقيّ لِلصَّلاحيَّات يَتِمّ عَبر space_info + upload أَدناه.
          try:
              me = api.whoami()
              print(f"  Token belongs to: {me.get('name', '?')} (type={me.get('type', '?')})")
          except Exception as e:
              print(f"  (whoami skipped: {str(e)[:80]})")

          # تَأكَّد أَنّ Space مَوجود (وإلّا أَخطَأ بِرسالَة واضِحَة).
          try:
              info = api.space_info(repo_id)
              print(f"  Space: {info.id} (sdk={info.sdk})")
          except HfHubHTTPError as e:
              print(f"::error::Cannot access Space '{repo_id}': {e}")
              print("Check: token owner has write access to that Space/org.")
              sys.exit(1)

          # رَفع كُلّ المُحتَوى. delete_patterns=['*'] يَحذِف أَيّ مَلَفّات في
          # الـ Space لَيسَت في الدُّفعَة (مُكافِئ orphan force-push). نَتَجاهَل
          # .git*/.github* (لا تَنبَغي أَن تَخرُج بَعد الـ prune لكِن احتياط).
          try:
              api.upload_folder(
                  folder_path='.',
                  repo_id=repo_id,
                  repo_type='space',
                  commit_message=msg,
                  delete_patterns=['*'],
                  ignore_patterns=['.git*', '.github*', '__pycache__*', '*.pyc'],
              )
              space_url = f"https://huggingface.co/spaces/{repo_id}"
              live_url = f"https://{repo_id.replace('/', '-').replace('.', '-')}.hf.space/"
              print(f"\n✅ Deployed: {space_url}")
              print(f"   Live URL:  {live_url}")
          except HfHubHTTPError as e:
              print(f"::error::Upload failed: {e}")
              sys.exit(1)
          PY
